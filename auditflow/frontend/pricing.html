<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("auditflow-theme");
          var d = t === "light" ? false : true;
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
    <title>الأسعار والاشتراك | OptimalSuite AI</title>
    <link rel="icon" href="/static/favicon.svg?v=9" type="image/svg+xml" />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/tailwind.css?v=9" />
    <link rel="stylesheet" href="/static/dark.css?v=9" />
    <style>
      body { font-family: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
      body.op-dashboard {
        --gold: #c9a24d;
        --gold-soft: #b8863a;
        --gold-dim: rgba(180, 140, 60, 0.35);
        --bg-page: #f6f1e4;
        --bg-1: #ffffff;
        --bg-2: #fdf9ef;
        --text-heading: #201a0c;
        --text-body: #55503f;
        --text-muted: #8a7f63;
        --surface-soft: rgba(180, 140, 60, 0.07);
        --input-bg: #ffffff;
        --input-border: rgba(180, 140, 60, 0.4);
        --input-text: #201a0c;
        background: var(--bg-page) !important;
        color: var(--text-body);
      }
      html.dark body.op-dashboard {
        --gold: #c9a24d;
        --gold-soft: #e8cd85;
        --gold-dim: rgba(201, 164, 77, 0.32);
        --bg-page: #070b16;
        --bg-1: #131b30;
        --bg-2: #0d1424;
        --text-heading: #f4e9cf;
        --text-body: #c7cede;
        --text-muted: #8a93a8;
        --surface-soft: rgba(255, 255, 255, 0.025);
        --input-bg: #070b16;
        --input-border: rgba(201, 164, 77, 0.28);
        --input-text: #f1e9d2;
      }
      body.op-dashboard.erp-shell { align-items: stretch; }
      body.op-dashboard .op-sidebar {
        display: none;
        width: 84px;
        flex-shrink: 0;
        background: rgba(9, 13, 24, 0.04);
        border-inline-end: 1px solid var(--gold-dim);
        flex-direction: column;
        align-items: center;
        padding: 1.25rem 0;
        gap: 0.5rem;
      }
      html.dark body.op-dashboard .op-sidebar { background: rgba(9, 13, 24, 0.95); }
      @media (min-width: 768px) {
        body.op-dashboard .op-sidebar { display: flex; }
      }
      body.op-dashboard .op-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 100vh;
      }
      body.op-dashboard .op-brand {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--gold), #8a6a1f);
        margin-bottom: 1.25rem;
        box-shadow: 0 8px 20px rgba(180, 140, 60, 0.25);
        flex-shrink: 0;
      }
      body.op-dashboard .op-sidebar-nav { flex: 1; overflow-y: auto; }
      body.op-dashboard .op-side-link {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        transition: all 0.15s ease;
        flex-shrink: 0;
      }
      body.op-dashboard .op-side-link:hover {
        background: var(--surface-soft);
        color: var(--gold-soft);
      }
      body.op-dashboard .op-side-link.nav-link--active {
        background: linear-gradient(135deg, rgba(180, 140, 60, 0.28), rgba(180, 140, 60, 0.08));
        color: var(--gold-soft);
        box-shadow: 0 0 18px rgba(180, 140, 60, 0.2);
      }
      body.op-dashboard .op-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 1rem 1.75rem;
        background: var(--bg-1);
        border-bottom: 1px solid var(--gold-dim);
        position: sticky;
        top: 0;
        z-index: 30;
        backdrop-filter: blur(6px);
      }
      body.op-dashboard .op-profile { display: flex; align-items: center; gap: 0.6rem; }
      body.op-dashboard .op-avatar {
        width: 42px; height: 42px; border-radius: 50%;
        background: linear-gradient(135deg, var(--gold-soft), var(--gold));
        color: #1a1406; display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 1.05rem; flex-shrink: 0;
      }
      body.op-dashboard .op-profile-name { color: var(--text-heading); font-weight: 800; font-size: 0.9rem; line-height: 1.3; }
      body.op-dashboard .op-profile-role { color: var(--text-muted); font-size: 0.72rem; font-weight: 700; }
      body.op-dashboard .op-icon-btn {
        width: 40px; height: 40px; border-radius: 12px;
        display: flex; align-items: center; justify-content: center;
        background: var(--surface-soft);
        border: 1px solid var(--gold-dim);
        color: var(--text-body);
        cursor: pointer;
      }
      body.op-dashboard .op-icon-btn:hover { background: rgba(180, 140, 60, 0.14); color: var(--gold-soft); }
      body.op-dashboard .op-main { padding: 2rem 1.75rem 3rem; max-width: 1180px; margin: 0 auto; width: 100%; }
      body.op-dashboard .op-support-card { display: none; }
      .pricing-hero { text-align: center; margin-bottom: 2.25rem; }
      .pricing-hero-eyebrow { color: var(--text-muted); font-weight: 700; font-size: 0.95rem; }
      .pricing-hero h1 { font-size: 2.2rem; font-weight: 800; color: var(--text-heading); margin: 0.35rem 0; }
      .pricing-hero h1 b { color: var(--gold-soft); font-weight: 800; }
      .pricing-hero p { color: var(--text-body); font-weight: 700; }
      .pricing-hero-rule { width: 70px; height: 3px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 0.9rem auto 0; border-radius: 3px; }
      .cycle-toggle {
        display: inline-flex; background: var(--surface-soft); border: 1px solid var(--gold-dim);
        border-radius: 999px; padding: 0.3rem; gap: 0.2rem; margin: 0 auto 2rem; display: flex; width: fit-content;
      }
      .cycle-btn {
        border: none; background: transparent; padding: 0.5rem 1.4rem; border-radius: 999px;
        font-weight: 800; font-size: 0.85rem; color: var(--text-muted); cursor: pointer;
      }
      .cycle-btn.active { background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #1a1406; }
      .plans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.25rem; }
      @media (max-width: 900px) { .plans-grid { grid-template-columns: 1fr; } }
      .plan-card {
        background: linear-gradient(175deg, var(--bg-2), var(--bg-1));
        border: 1px solid var(--gold-dim);
        border-radius: 20px; padding: 1.75rem 1.5rem; text-align: center;
        display: flex; flex-direction: column; position: relative;
      }
      .plan-card.featured { border: 1px solid var(--gold); box-shadow: 0 12px 30px rgba(180, 140, 60, 0.18); transform: translateY(-6px); }
      .plan-badge {
        position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
        background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #1a1406;
        font-size: 0.7rem; font-weight: 800; padding: 0.25rem 0.9rem; border-radius: 999px;
      }
      .plan-name { font-size: 1.15rem; font-weight: 800; color: var(--text-heading); margin-bottom: 0.4rem; }
      .plan-price { font-size: 2.1rem; font-weight: 800; color: var(--gold-soft); }
      .plan-price small { font-size: 0.85rem; font-weight: 700; color: var(--text-muted); }
      .plan-features { list-style: none; padding: 0; margin: 1.25rem 0; text-align: right; flex: 1; }
      .plan-features li { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0; font-size: 0.85rem; color: var(--text-body); font-weight: 700; }
      .plan-features li::before { content: "✓"; color: var(--gold-soft); font-weight: 800; }
      .plan-cta {
        display: block; text-align: center; padding: 0.75rem 1rem; border-radius: 12px;
        background: linear-gradient(135deg, var(--gold-soft), var(--gold)); color: #1a1406;
        font-weight: 800; text-decoration: none; border: none; cursor: pointer; font-size: 0.9rem;
      }
      .plan-cta:hover { opacity: 0.92; }
      .plan-cta.outline { background: transparent; border: 1px solid var(--gold-dim); color: var(--text-heading); }
    </style>
  </head>
