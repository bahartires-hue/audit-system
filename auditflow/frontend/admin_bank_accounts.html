<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("auditflow-theme");
          var d = t === "light" ? false : true;
          document.documentElement.classList.toggle("dark", d);
        } catch (e) {}
      })();
    </script>
    <title>الحسابات البنكية — OptimalSuite AI</title>
    <link rel="stylesheet" href="/static/tailwind.css?v=9" />
    <link rel="stylesheet" href="/static/dark.css?v=9" />
    <link rel="stylesheet" href="/static/admin_layout.css?v=1" />
    <link rel="icon" href="/static/favicon.svg?v=9" />
  </head>
  <body class="admin2-shell" data-admin-active="bank_accounts" data-admin-title="الحسابات البنكية">
    <div id="toast" class="hidden toast-host text-white px-4 py-3 rounded-xl font-extrabold text-sm"></div>
    <div id="adminLayoutHost"></div>

    <main id="adminContent" class="admin2-content">
      <div class="a2-card" style="margin-bottom:1rem;">
        <h2 class="a2-card-title">🏦 إضافة حساب بنكي جديد</h2>
        <form id="bankAccForm" class="a2-grid a2-grid-2" style="gap:0.6rem;">
          <div>
            <label style="display:block; font-size:0.78rem; color:var(--a2-text-muted); margin-bottom:0.3rem;">اسم البنك</label>
            <input id="baBankName" type="text" class="a2-input" style="width:100%;" required />
          </div>
          <div>
            <label style="display:block; font-size:0.78rem; color:var(--a2-text-muted); margin-bottom:0.3rem;">اسم المستفيد</label>
            <input id="baBeneficiary" type="text" class="a2-input" style="width:100%;" required />
          </div>
          <div>
            <label style="display:block; font-size:0.78rem; color:var(--a2-text-muted); margin-bottom:0.3rem;">رقم الحساب</label>
            <input id="baAccountNumber" type="text" class="a2-input" style="width:100%;" dir="ltr" required />
          </div>
          <div>
            <label style="display:block; font-size:0.78rem; color:var(--a2-text-muted); margin-bottom:0.3rem;">IBAN</label>
            <input id="baIban" type="text" class="a2-input" style="width:100%;" dir="ltr" required />
          </div>
          <div style="grid-column:1/-1;">
            <button type="submit" class="a2-btn">إضافة الحساب</button>
          </div>
        </form>
      </div>

      <div class="a2-card">
        <h2 class="a2-card-title">🏦 الحسابات البنكية المسجّلة</h2>
        <div style="overflow-x:auto;">
          <table class="a2-table">
            <thead>
              <tr>
                <th>البنك</th>
                <th>المستفيد</th>
                <th>رقم الحساب</th>
                <th>IBAN</th>
                <th>الحالة</th>
                <th>إجراء</th>
              </tr>
            </thead>
            <tbody id="bankAccountsHost">
              <tr><td colspan="6" class="a2-empty">جارٍ التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="/static/app.js?v=19"></script>
    <script src="/static/admin_layout.js?v=1"></script>
    <script>
      function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      }

      async function loadBankAccounts() {
        const host = document.getElementById("bankAccountsHost");
        host.innerHTML = '<tr><td colspan="6" class="a2-empty">جارٍ التحميل...</td></tr>';
        try {
          const data = await apiGet("/admin/bank-accounts");
          const items = data.items || [];
          if (!items.length) {
            host.innerHTML = '<tr><td colspan="6" class="a2-empty">لا توجد حسابات بنكية بعد</td></tr>';
            return;
          }
          host.innerHTML = "";
          items.forEach((b) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>${escapeHtml(b.bank_name)}</td>
              <td>${escapeHtml(b.beneficiary_name)}</td>
              <td dir="ltr">${escapeHtml(b.account_number)}</td>
              <td dir="ltr" style="font-size:0.78rem;">${escapeHtml(b.iban)}</td>
              <td><span class="a2-badge ${b.is_active ? "a2-badge-success" : "a2-badge-neutral"}">${b.is_active ? "مفعّل" : "معطّل"}</span></td>
              <td>
                <div style="display:flex; gap:0.4rem;">
                  <button type="button" class="a2-btn a2-btn-sm a2-btn-outline" data-toggle="${b.id}" data-active="${b.is_active ? 1 : 0}">${b.is_active ? "تعطيل" : "تفعيل"}</button>
                  <button type="button" class="a2-btn a2-btn-sm a2-btn-danger" data-del="${b.id}">حذف</button>
                </div>
              </td>
            `;
            host.appendChild(tr);
          });
          host.querySelectorAll("[data-toggle]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              try {
                await apiPatchJson("/admin/bank-accounts/" + btn.getAttribute("data-toggle"), {
                  is_active: btn.getAttribute("data-active") !== "1",
                });
                loadBankAccounts();
              } catch (e) {
                showToast(e.message || "فشل التحديث", "#ef4444");
              }
            });
          });
          host.querySelectorAll("[data-del]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              if (!confirm("هل تريد حذف هذا الحساب البنكي؟")) return;
              try {
                await apiDelete("/admin/bank-accounts/" + btn.getAttribute("data-del"));
                showToast("تم الحذف", "#10b981");
                loadBankAccounts();
              } catch (e) {
                showToast(e.message || "فشل الحذف", "#ef4444");
              }
            });
          });
        } catch (e) {
          host.innerHTML = '<tr><td colspan="6" class="a2-empty">تعذر تحميل الحسابات</td></tr>';
        }
      }

      document.getElementById("bankAccForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        try {
          await apiPostJson("/admin/bank-accounts", {
            bank_name: document.getElementById("baBankName").value.trim(),
            beneficiary_name: document.getElementById("baBeneficiary").value.trim(),
            account_number: document.getElementById("baAccountNumber").value.trim(),
            iban: document.getElementById("baIban").value.trim(),
          });
          showToast("تمت إضافة الحساب البنكي", "#10b981");
          document.getElementById("bankAccForm").reset();
          loadBankAccounts();
        } catch (e2) {
          showToast(e2.message || "فشل إضافة الحساب", "#ef4444");
        }
      });

      loadBankAccounts();
    </script>
  </body>
</html>
