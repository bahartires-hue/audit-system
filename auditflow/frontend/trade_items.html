<!doctype html>
<html lang="ar" dir="rtl">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>الأصناف | المالية</title><link rel="stylesheet" href="/static/tailwind.css?v=9" /><link rel="stylesheet" href="/static/dark.css?v=9" />
  <style>
    .fin-nav { display:flex; flex-wrap:wrap; gap:8px; align-items:center; padding:10px 14px; border-radius:14px; background:linear-gradient(90deg, rgba(180,140,60,0.14), rgba(180,140,60,0.03)); border:1px solid rgba(180,140,60,0.35); margin-bottom:14px; }
    .fin-nav a { padding:7px 14px; border-radius:999px; font-weight:800; font-size:0.85rem; border:1px solid rgba(180,140,60,0.35); color:#8a6a1f; }
    html.dark .fin-nav a { color:#e8cd85; }
    .fin-nav a.active { background:linear-gradient(270deg, #8a6a1f 0%, #c9a24d 45%, #b8863a 100%); color:#1a1406 !important; border:none; }
    .fin-nav .fin-label { font-weight:800; color:#8a6a1f; }
    html.dark .fin-nav .fin-label { color:#e8cd85; }
  </style>
  </head>
  <body class="bg-slate-100 dark:bg-[#050508] text-slate-900 dark:text-slate-100 min-h-screen">
    <div class="max-w-7xl mx-auto p-4 space-y-4">
      <div class="fin-nav">
        <span class="fin-label">💰 المالية</span>
        <a href="/trade/items" class="active">📦 الأصناف</a>
        <a href="/trade/purchases">📥 المشتريات</a>
        <a href="/inventory-management">🧾 نقطة البيع</a>
        <a href="/trade/reports">📊 التقارير</a>
      </div>

      <div class="rounded-xl border p-4 bg-white dark:bg-slate-950">
        <h1 class="text-xl font-extrabold mb-3">➕ إضافة صنف جديد</h1>
        <div class="grid grid-cols-1 md:grid-cols-4 gap-2">
          <input id="name" class="rounded-xl border px-3 py-2 bg-white dark:bg-slate-950" placeholder="اسم الصنف" />
          <input id="purchasePrice" type="number" step="0.01" class="rounded-xl border px-3 py-2 bg-white dark:bg-slate-950" placeholder="سعر الشراء الافتراضي" />
          <input id="salePrice" type="number" step="0.01" class="rounded-xl border px-3 py-2 bg-white dark:bg-slate-950" placeholder="سعر البيع الافتراضي" />
          <input id="notes" class="rounded-xl border px-3 py-2 bg-white dark:bg-slate-950" placeholder="ملاحظات (اختياري)" />
        </div>
        <button id="addBtn" class="mt-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold px-5 py-2">💾 إضافة الصنف</button>
      </div>

      <div class="rounded-xl border p-4 bg-white dark:bg-slate-950">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3">
          <h2 class="font-extrabold">📋 قائمة الأصناف</h2>
          <div class="flex flex-wrap gap-2">
            <a id="exportBtn" href="/api/trade/items/export" class="rounded-xl border font-extrabold px-4 py-2">⬇️ تصدير Excel</a>
            <button id="importBtn" class="rounded-xl border font-extrabold px-4 py-2">⬆️ استيراد من Excel</button>
            <input type="file" id="importFile" accept=".xlsx,.xls" style="display:none" />
          </div>
        </div>
        <input id="searchQ" class="rounded-xl border px-3 py-2 bg-white dark:bg-slate-950 w-full mb-3" placeholder="بحث بالاسم أو الكود..." />
        <div id="host"></div>
      </div>
    </div>
    <script src="/static/app.js?v=19"></script>
    <script>
      (async function () {
        await initAuthUI();
        var rows = [];
        var editingId = null;
        function esc(s){return String(s==null?"":s).replace(/[&<>"']/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]; });}
        function money(v){return (Math.round((Number(v)||0)*100)/100).toFixed(2);}

        function renderRow(x) {
          if (editingId === x.id) {
            return '<div class="rounded-lg border px-3 py-2">' +
              '<div class="grid grid-cols-1 md:grid-cols-4 gap-2">' +
              '<input class="rounded-lg border px-2 py-1 bg-white dark:bg-slate-950" data-ef="name" value="' + esc(x.name) + '" />' +
              '<input type="number" step="0.01" class="rounded-lg border px-2 py-1 bg-white dark:bg-slate-950" data-ef="purchase" value="' + esc(x.last_cost) + '" />' +
              '<input type="number" step="0.01" class="rounded-lg border px-2 py-1 bg-white dark:bg-slate-950" data-ef="sale" value="' + esc(x.default_sale_price) + '" />' +
              '<input class="rounded-lg border px-2 py-1 bg-white dark:bg-slate-950" data-ef="notes" value="' + esc(x.notes||"") + '" />' +
              '</div>' +
              '<div class="flex gap-2 mt-2">' +
              '<button class="rounded-lg bg-emerald-600 text-white px-3 py-1 font-bold" data-save="' + esc(x.id) + '">حفظ</button>' +
              '<button class="rounded-lg border px-3 py-1 font-bold" data-cancel="1">إلغاء</button>' +
              '</div></div>';
          }
          return '<div class="rounded-lg border px-3 py-2 flex flex-wrap items-center justify-between gap-2">' +
            '<div><div class="font-bold">' + esc(x.name) + '</div>' +
            '<div class="text-sm mt-1 opacity-80">شراء: ' + money(x.last_cost) + ' | بيع: ' + money(x.default_sale_price) + ' | الكمية الحالية: ' + esc(x.quantity) + (x.notes ? (' | ' + esc(x.notes)) : "") + '</div></div>' +
            '<div class="flex gap-2">' +
            '<button class="rounded-lg border px-3 py-1 font-bold" data-edit="' + esc(x.id) + '">تعديل</button>' +
            '<button class="rounded-lg border px-3 py-1 font-bold text-red-600" data-del="' + esc(x.id) + '">حذف</button>' +
            '</div></div>';
        }

        function renderList() {
          var host = document.getElementById("host");
          host.innerHTML = rows.length ? '<div class="grid gap-2">' + rows.map(renderRow).join("") + '</div>' : '<div class="opacity-70">لا توجد أصناف</div>';
          host.querySelectorAll("[data-edit]").forEach(function (btn) {
            btn.addEventListener("click", function () { editingId = btn.getAttribute("data-edit"); renderList(); });
          });
          host.querySelectorAll("[data-cancel]").forEach(function (btn) {
            btn.addEventListener("click", function () { editingId = null; renderList(); });
          });
          host.querySelectorAll("[data-save]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
              var id = btn.getAttribute("data-save");
              var box = btn.closest("div").parentElement;
              var name = box.querySelector('[data-ef="name"]').value.trim();
              var purchase = Number(box.querySelector('[data-ef="purchase"]').value || 0);
              var sale = Number(box.querySelector('[data-ef="sale"]').value || 0);
              var notes = box.querySelector('[data-ef="notes"]').value.trim();
              try {
                await apiPatchJson("/api/trade/items/" + encodeURIComponent(id), { name: name, default_purchase_price: purchase, default_sale_price: sale, notes: notes });
                showToast("تم تعديل الصنف ✔️", "#10b981");
                editingId = null;
                await load();
              } catch (e) { showToast(e.message || "فشل التعديل", "#ef4444"); }
            });
          });
          host.querySelectorAll("[data-del]").forEach(function (btn) {
            btn.addEventListener("click", async function () {
              if (!confirm("هل تريد حذف هذا الصنف؟")) return;
              try {
                await apiDelete("/api/trade/items/" + encodeURIComponent(btn.getAttribute("data-del")));
                showToast("تم حذف الصنف ✔️", "#10b981");
                await load();
              } catch (e) { showToast(e.message || "لا يمكن حذف الصنف لوجود حركات عليه", "#ef4444"); }
            });
          });
        }

        async function load() {
          var q = document.getElementById("searchQ").value || "";
          var d = await apiGet("/api/trade/items?q=" + encodeURIComponent(q));
          rows = d.items || [];
          renderList();
        }

        document.getElementById("addBtn").addEventListener("click", async function () {
          var name = document.getElementById("name").value.trim();
          if (!name) { showToast("اكتب اسم الصنف أولاً", "#ef4444"); return; }
          var code = "ITM-" + Date.now().toString(36).toUpperCase();
          try {
            await apiPostJson("/api/trade/items", {
              code: code,
              name: name,
              default_purchase_price: Number(document.getElementById("purchasePrice").value || 0),
              default_sale_price: Number(document.getElementById("salePrice").value || 0),
              notes: document.getElementById("notes").value || "",
              unit: "قطعة",
              category: "rim",
              is_taxable: true,
              tax_rate: 0,
              is_active: true,
            });
            showToast("تمت إضافة الصنف ✔️", "#10b981");
            document.getElementById("name").value = "";
            document.getElementById("purchasePrice").value = "";
            document.getElementById("salePrice").value = "";
            document.getElementById("notes").value = "";
            await load();
          } catch (e) { showToast(e.message || "فشلت الإضافة", "#ef4444"); }
        });

        document.getElementById("searchQ").addEventListener("input", load);

        document.getElementById("importBtn").addEventListener("click", function () {
          document.getElementById("importFile").click();
        });
        document.getElementById("importFile").addEventListener("change", async function () {
          var f = this.files && this.files[0];
          if (!f) return;
          try {
            var fd = new FormData();
            fd.append("file", f);
            var res = await apiPostForm("/api/trade/items/import", fd);
            showToast("تم الاستيراد: " + res.created + " جديد، " + res.updated + " محدَّث" + (res.errors && res.errors.length ? ("، " + res.errors.length + " خطأ") : ""), "#10b981");
            await load();
          } catch (e) { showToast(e.message || "فشل الاستيراد", "#ef4444"); }
          this.value = "";
        });

        await load();
      })();
    </script>
  </body>
</html>
